trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - "*"

variables:
  PREFIX: cvm
  ENV: dev
  LOCATION: westeurope

stages:
- stage: Plan
  displayName: Plan
  jobs:
  - job: Plan
    displayName: Terraform plan
    pool:
      name: Default
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Bootstrap Terraform backend (dev)
      inputs:
        azureSubscription: SC-AZURE
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          & "$(Build.SourcesDirectory)/pipelines/scripts/bootstrap-tf-backend.ps1" `
            -Prefix "$(PREFIX)" `
            -EnvName "$(ENV)" `
            -Location "$(LOCATION)"

    - template: pipelines/templates/terraform-plan.yml
      parameters:
        azureServiceConnection: SC-AZURE
        workingDirectory: terraform/envs/dev
        tfVersion: 1.6.6

- stage: Apply
  displayName: Apply
  dependsOn: Plan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: ApplyDev
    displayName: Terraform apply (dev)
    environment: cvm-dev
    pool:
      name: Default
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Bootstrap Terraform backend (dev)
            inputs:
              azureSubscription: SC-AZURE
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                & "$(Build.SourcesDirectory)/pipelines/scripts/bootstrap-tf-backend.ps1" `
                  -Prefix "$(PREFIX)" `
                  -EnvName "$(ENV)" `
                  -Location "$(LOCATION)"

          - template: pipelines/templates/terraform-apply.yml
            parameters:
              azureServiceConnection: SC-AZURE
              workingDirectory: terraform/envs/dev
              tfVersion: 1.6.6
