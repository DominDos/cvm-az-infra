trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - "*"

variables:
  PREFIX: cvm
  ENV: dev
  LOCATION: westeurope

stages:
- stage: Plan
  displayName: Plan
  jobs:
  - job: Plan
    displayName: Terraform plan
    pool:
      name: Default
    steps:
    - checkout: self
      clean: true

    - task: AzureCLI@2
      displayName: Bootstrap Terraform backend (dev)
      inputs:
        azureSubscription: SC-AZURE
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          $roots = @(
            "$(Build.SourcesDirectory)",
            "$(System.DefaultWorkingDirectory)",
            "$(Pipeline.Workspace)/s"
          )

          $scriptPath = $null
          foreach ($root in $roots) {
            if ([string]::IsNullOrWhiteSpace($root)) { continue }

            $candidate = Join-Path $root 'pipelines/scripts/bootstrap-tf-backend.ps1'
            if (Test-Path $candidate) { $scriptPath = $candidate; break }

            $candidate = Join-Path $root "$(Build.Repository.Name)/pipelines/scripts/bootstrap-tf-backend.ps1"
            if (Test-Path $candidate) { $scriptPath = $candidate; break }
          }

          if (-not $scriptPath) {
            Write-Host "Build.SourcesDirectory=$(Build.SourcesDirectory)"
            Write-Host "System.DefaultWorkingDirectory=$(System.DefaultWorkingDirectory)"
            Write-Host "Pipeline.Workspace=$(Pipeline.Workspace)"
            throw 'bootstrap-tf-backend.ps1 not found in checked-out sources.'
          }

          & $scriptPath `
            -Prefix "$(PREFIX)" `
            -EnvName "$(ENV)" `
            -Location "$(LOCATION)"

    - template: pipelines/templates/terraform-plan.yml
      parameters:
        azureServiceConnection: SC-AZURE
        workingDirectory: terraform/envs/dev
        tfVersion: 1.6.6

- stage: Apply
  displayName: Apply
  dependsOn: Plan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: ApplyDev
    displayName: Terraform apply (dev)
    environment: cvm-dev
    pool:
      name: Default
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            clean: true

          - task: AzureCLI@2
            displayName: Bootstrap Terraform backend (dev)
            inputs:
              azureSubscription: SC-AZURE
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'

                $roots = @(
                  "$(Build.SourcesDirectory)",
                  "$(System.DefaultWorkingDirectory)",
                  "$(Pipeline.Workspace)/s"
                )

                $scriptPath = $null
                foreach ($root in $roots) {
                  if ([string]::IsNullOrWhiteSpace($root)) { continue }

                  $candidate = Join-Path $root 'pipelines/scripts/bootstrap-tf-backend.ps1'
                  if (Test-Path $candidate) { $scriptPath = $candidate; break }

                  $candidate = Join-Path $root "$(Build.Repository.Name)/pipelines/scripts/bootstrap-tf-backend.ps1"
                  if (Test-Path $candidate) { $scriptPath = $candidate; break }
                }

                if (-not $scriptPath) {
                  Write-Host "Build.SourcesDirectory=$(Build.SourcesDirectory)"
                  Write-Host "System.DefaultWorkingDirectory=$(System.DefaultWorkingDirectory)"
                  Write-Host "Pipeline.Workspace=$(Pipeline.Workspace)"
                  throw 'bootstrap-tf-backend.ps1 not found in checked-out sources.'
                }

                & $scriptPath `
                  -Prefix "$(PREFIX)" `
                  -EnvName "$(ENV)" `
                  -Location "$(LOCATION)"

          - template: pipelines/templates/terraform-apply.yml
            parameters:
              azureServiceConnection: SC-AZURE
              workingDirectory: terraform/envs/dev
              tfVersion: 1.6.6
