parameters:
  azureServiceConnection: ''
  workingDirectory: ''
  tfVersion: '1.6.6'

steps:
- checkout: self

- bash: |
    set -euo pipefail
    TF_VERSION='${{ parameters.tfVersion }}'
    curl -sSLo terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
    unzip -o terraform.zip
    sudo mv terraform /usr/local/bin/terraform
    terraform version
  displayName: Install Terraform

- task: DownloadPipelineArtifact@2
  displayName: Download tfplan artifact
  inputs:
    artifact: tfplan
    path: '$(Pipeline.Workspace)/tfplan'

- task: AzureCLI@2
  displayName: Terraform init/apply
  inputs:
    azureSubscription: ${{ parameters.azureServiceConnection }}
    addSpnToEnvironment: true
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail
      cd '${{ parameters.workingDirectory }}'

      export ARM_CLIENT_ID="$servicePrincipalId"
      export ARM_CLIENT_SECRET="$servicePrincipalKey"
      export ARM_TENANT_ID="$tenantId"
      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

      cp '$(Pipeline.Workspace)/tfplan/tfplan' ./tfplan

      terraform init -input=false \
        -backend-config="resource_group_name=$(TF_STATE_RG)" \
        -backend-config="storage_account_name=$(TF_STATE_STORAGE)" \
        -backend-config="container_name=$(TF_STATE_CONTAINER)" \
        -backend-config="key=$(TF_STATE_KEY)"

      terraform apply -auto-approve -input=false tfplan

      AKS_NAME=$(terraform output -raw aks_name)
      AKS_RG=$(terraform output -raw resource_group_name)

      echo "##vso[task.setvariable variable=AKS_NAME]$AKS_NAME"
      echo "##vso[task.setvariable variable=AKS_RG]$AKS_RG"

- task: AzureCLI@2
  displayName: Install ingress-nginx
  inputs:
    azureSubscription: ${{ parameters.azureServiceConnection }}
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail
      chmod +x pipelines/scripts/install-nginx-ingress.sh
      AKS_NAME='$(AKS_NAME)' AKS_RG='$(AKS_RG)' ./pipelines/scripts/install-nginx-ingress.sh
