parameters:
  azureServiceConnection: ''
  workingDirectory: ''
  tfVersion: '1.6.6'

steps:
- checkout: self

- pwsh: |
    $ErrorActionPreference = 'Stop'

    $version = '${{ parameters.tfVersion }}'
    $installDir = "$(Agent.TempDirectory)/terraform/$version"
    $exePath = Join-Path $installDir 'terraform.exe'

    if (-not (Test-Path $exePath)) {
      New-Item -ItemType Directory -Force -Path $installDir | Out-Null

      $zipPath = Join-Path $installDir 'terraform.zip'
      $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"

      Invoke-WebRequest -Uri $url -OutFile $zipPath
      Expand-Archive -Path $zipPath -DestinationPath $installDir -Force
    }

    Write-Host "##vso[task.prependpath]$installDir"
    terraform version
  displayName: Install Terraform

- task: DownloadPipelineArtifact@2
  displayName: Download tfplan artifact
  inputs:
    artifact: tfplan
    path: '$(Pipeline.Workspace)/tfplan'

- task: AzureCLI@2
  displayName: Terraform init/apply
  inputs:
    azureSubscription: ${{ parameters.azureServiceConnection }}
    addSpnToEnvironment: true
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      $ErrorActionPreference = 'Stop'

      $workDir = '${{ parameters.workingDirectory }}'

      $env:ARM_CLIENT_ID = $env:servicePrincipalId
      $env:ARM_TENANT_ID = $env:tenantId
      $env:ARM_SUBSCRIPTION_ID = (az account show --query id -o tsv)
      $env:ARM_USE_AZUREAD = 'true'

      # Azure DevOps service connection may be configured either with a client secret (servicePrincipalKey)
      # or with workload identity federation (OIDC). Configure azurerm provider accordingly.
      if (-not [string]::IsNullOrWhiteSpace($env:servicePrincipalKey)) {
        $env:ARM_CLIENT_SECRET = $env:servicePrincipalKey
        if (Test-Path Env:ARM_USE_OIDC) { Remove-Item Env:ARM_USE_OIDC -ErrorAction SilentlyContinue }
        if (Test-Path Env:ARM_OIDC_TOKEN) { Remove-Item Env:ARM_OIDC_TOKEN -ErrorAction SilentlyContinue }
      }
      elseif (-not [string]::IsNullOrWhiteSpace($env:idToken)) {
        $env:ARM_USE_OIDC = 'true'
        $env:ARM_OIDC_TOKEN = $env:idToken
        if (Test-Path Env:ARM_CLIENT_SECRET) { Remove-Item Env:ARM_CLIENT_SECRET -ErrorAction SilentlyContinue }
      }
      else {
        throw 'No Service Principal secret (servicePrincipalKey) or OIDC token (idToken) provided by the Azure service connection. Update the Azure DevOps service connection auth method.'
      }

      $backendVars = @{
        TF_STATE_RG        = $env:TF_STATE_RG
        TF_STATE_STORAGE   = $env:TF_STATE_STORAGE
        TF_STATE_CONTAINER = $env:TF_STATE_CONTAINER
        TF_STATE_KEY       = $env:TF_STATE_KEY
      }

      $missing = @(
        $backendVars.GetEnumerator() |
          Where-Object { [string]::IsNullOrWhiteSpace($_.Value) -or $_.Value.Contains('$(') } |
          ForEach-Object { $_.Key }
      )

      if ($missing.Count -gt 0) {
        throw "Missing/unresolved backend variables: $($missing -join ', '). Ensure bootstrap ran in this job or set TF_STATE_* variables in the pipeline."
      }

      # Use storage account access key for backend data-plane auth (avoids needing Blob Data roles).
      $accountKey = (az storage account keys list --account-name $env:TF_STATE_STORAGE --resource-group $env:TF_STATE_RG --query "[0].value" -o tsv)
      if ([string]::IsNullOrWhiteSpace($accountKey)) {
        throw 'Failed to retrieve storage account key for Terraform backend. Ensure the service connection has permission to list storage keys.'
      }
      $env:ARM_ACCESS_KEY = $accountKey

      Copy-Item -Force "$(Pipeline.Workspace)/tfplan/tfplan" (Join-Path $workDir 'tfplan')

      $tfDir = Join-Path $workDir '.terraform'
      if (Test-Path $tfDir) {
        Remove-Item -Recurse -Force $tfDir
      }

      terraform -chdir="$workDir" init -input=false -reconfigure -upgrade `
        -backend-config="resource_group_name=$($env:TF_STATE_RG)" `
        -backend-config="storage_account_name=$($env:TF_STATE_STORAGE)" `
        -backend-config="container_name=$($env:TF_STATE_CONTAINER)" `
        -backend-config="key=$($env:TF_STATE_KEY)"
      if ($LASTEXITCODE -ne 0) { throw "terraform init failed with exit code $LASTEXITCODE" }

      terraform -chdir="$workDir" apply -auto-approve -input=false tfplan
      if ($LASTEXITCODE -ne 0) { throw "terraform apply failed with exit code $LASTEXITCODE" }

      $aksName = (terraform -chdir="$workDir" output -raw aks_name)
      if ($LASTEXITCODE -ne 0) { throw "terraform output aks_name failed with exit code $LASTEXITCODE" }
      $aksRg = (terraform -chdir="$workDir" output -raw resource_group_name)
      if ($LASTEXITCODE -ne 0) { throw "terraform output resource_group_name failed with exit code $LASTEXITCODE" }

      Write-Host "##vso[task.setvariable variable=AKS_NAME]$aksName"
      Write-Host "##vso[task.setvariable variable=AKS_RG]$aksRg"
  env:
    TF_STATE_RG: $(TF_STATE_RG)
    TF_STATE_STORAGE: $(TF_STATE_STORAGE)
    TF_STATE_CONTAINER: $(TF_STATE_CONTAINER)
    TF_STATE_KEY: $(TF_STATE_KEY)

- task: AzureCLI@2
  displayName: Install ingress-nginx
  inputs:
    azureSubscription: ${{ parameters.azureServiceConnection }}
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      $ErrorActionPreference = 'Stop'

      $env:AKS_NAME = '$(AKS_NAME)'
      $env:AKS_RG = '$(AKS_RG)'

      $roots = @(
        "$(Build.SourcesDirectory)",
        "$(System.DefaultWorkingDirectory)",
        "$(Pipeline.Workspace)/s"
      )

      $scriptPath = $null
      foreach ($root in $roots) {
        if ([string]::IsNullOrWhiteSpace($root)) { continue }

        $candidate = Join-Path $root 'pipelines/scripts/install-nginx-ingress.ps1'
        if (Test-Path $candidate) { $scriptPath = $candidate; break }

        $candidate = Join-Path $root "$(Build.Repository.Name)/pipelines/scripts/install-nginx-ingress.ps1"
        if (Test-Path $candidate) { $scriptPath = $candidate; break }
      }

      if (-not $scriptPath) {
        Write-Host "Build.SourcesDirectory=$(Build.SourcesDirectory)"
        Write-Host "System.DefaultWorkingDirectory=$(System.DefaultWorkingDirectory)"
        Write-Host "Pipeline.Workspace=$(Pipeline.Workspace)"
        throw 'install-nginx-ingress.ps1 not found in checked-out sources.'
      }

      & $scriptPath
