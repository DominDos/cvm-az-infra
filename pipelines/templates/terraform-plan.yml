parameters:
  azureServiceConnection: ''
  workingDirectory: ''
  tfVersion: '1.6.6'

steps:
- checkout: self

- task: TerraformInstaller@1
  displayName: Install Terraform
  inputs:
    terraformVersion: '${{ parameters.tfVersion }}'

- pwsh: |
    $ErrorActionPreference = 'Stop'
    terraform -chdir='${{ parameters.workingDirectory }}' fmt -check -recursive
  displayName: Terraform fmt (check)

- task: AzureCLI@2
  displayName: Terraform init/validate/plan
  inputs:
    azureSubscription: ${{ parameters.azureServiceConnection }}
    addSpnToEnvironment: true
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      $ErrorActionPreference = 'Stop'

      Set-Location '${{ parameters.workingDirectory }}'

      $env:ARM_CLIENT_ID = $env:servicePrincipalId
      $env:ARM_CLIENT_SECRET = $env:servicePrincipalKey
      $env:ARM_TENANT_ID = $env:tenantId
      $env:ARM_SUBSCRIPTION_ID = $env:subscriptionId

      terraform init -input=false `
        -backend-config="resource_group_name=$(TF_STATE_RG)" `
        -backend-config="storage_account_name=$(TF_STATE_STORAGE)" `
        -backend-config="container_name=$(TF_STATE_CONTAINER)" `
        -backend-config="key=$(TF_STATE_KEY)"

      terraform validate
      terraform plan -out=tfplan -input=false

- task: PublishPipelineArtifact@1
  displayName: Publish tfplan artifact
  inputs:
    targetPath: '${{ parameters.workingDirectory }}/tfplan'
    artifact: tfplan
    publishLocation: pipeline
