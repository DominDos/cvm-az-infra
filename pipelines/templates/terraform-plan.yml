parameters:
  azureServiceConnection: ''
  workingDirectory: ''
  tfVersion: '1.6.6'

steps:
- checkout: self

- bash: |
    set -euo pipefail
    TF_VERSION='${{ parameters.tfVersion }}'
    curl -sSLo terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
    unzip -o terraform.zip
    sudo mv terraform /usr/local/bin/terraform
    terraform version
  displayName: Install Terraform

- bash: |
    set -euo pipefail
    terraform -chdir='${{ parameters.workingDirectory }}' fmt -check -recursive
  displayName: Terraform fmt (check)

- task: AzureCLI@2
  displayName: Terraform init/validate/plan
  inputs:
    azureSubscription: ${{ parameters.azureServiceConnection }}
    addSpnToEnvironment: true
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail
      cd '${{ parameters.workingDirectory }}'

      export ARM_CLIENT_ID="$servicePrincipalId"
      export ARM_CLIENT_SECRET="$servicePrincipalKey"
      export ARM_TENANT_ID="$tenantId"
      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

      terraform init -input=false \
        -backend-config="resource_group_name=$(TF_STATE_RG)" \
        -backend-config="storage_account_name=$(TF_STATE_STORAGE)" \
        -backend-config="container_name=$(TF_STATE_CONTAINER)" \
        -backend-config="key=$(TF_STATE_KEY)"

      terraform validate
      terraform plan -out=tfplan -input=false

- task: PublishPipelineArtifact@1
  displayName: Publish tfplan artifact
  inputs:
    targetPath: '${{ parameters.workingDirectory }}/tfplan'
    artifact: tfplan
    publishLocation: pipeline
