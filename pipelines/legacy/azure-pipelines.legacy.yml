# LEGACY PIPELINE (archived)
#
# This pipeline is kept for historical reference only.
# Canonical pipeline definitions live at the repo root:
# - azure-pipelines-bootstrap.yml (manual bootstrap of TF remote state)
# - azure-pipelines.yml (plan/apply using shared templates)
#
# If you had an Azure DevOps pipeline pointing at this file, update it to use
# the root `azure-pipelines.yml` instead.

trigger:
- none

pool:
  name: Default

# Placeholder variable group for platform provisioning
variables:
  - group: platform-infra-dev

stages:
- stage: Terraform
  displayName: Terraform (validate/plan/apply)
  jobs:
  - job: Apply
    displayName: Apply
    steps:
    - checkout: self

    - pwsh: |
        $ErrorActionPreference = 'Stop'

        $version = '1.6.6'
        $installDir = "$(Agent.TempDirectory)/terraform/$version"
        $exePath = Join-Path $installDir 'terraform.exe'

        if (-not (Test-Path $exePath)) {
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          $zipPath = Join-Path $installDir 'terraform.zip'
          $url = "https://releases.hashicorp.com/terraform/$version/terraform_${version}_windows_amd64.zip"

          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $installDir -Force
        }

        Write-Host "##vso[task.prependpath]$installDir"
        terraform version
      displayName: Install Terraform

    # Uses an Azure RM service connection; Terraform authenticates via ARM_* env vars.
    - task: AzureCLI@2
      displayName: Terraform apply + publish outputs
      inputs:
        azureSubscription: $(AZURE_SERVICE_CONNECTION)
        scriptType: pscore
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          Set-Location terraform

          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_CLIENT_SECRET = $env:servicePrincipalKey
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_SUBSCRIPTION_ID = $env:subscriptionId

          terraform --version
          terraform init
          terraform validate
          terraform plan -out tfplan
          terraform apply -auto-approve tfplan

          New-Item -ItemType Directory -Force -Path out | Out-Null

          terraform output -json | Out-File -FilePath out/infra_outputs.json -Encoding utf8

          @(
            "AZURE_RG=$(terraform output -raw resource_group_name)",
            "AKS_NAME=$(terraform output -raw aks_name)",
            "ACR_NAME=$(terraform output -raw acr_name)",
            "ACR_LOGIN_SERVER=$(terraform output -raw acr_login_server)"
          ) | Out-File -FilePath out/infra_outputs.env -Encoding utf8

          Write-Host "Generated infra outputs:"
          Get-Content out/infra_outputs.env

    - task: PublishPipelineArtifact@1
      displayName: Publish pipeline artifact: infra-outputs
      inputs:
        targetPath: terraform/out
        artifact: infra-outputs
        publishLocation: pipeline
