trigger: none
pr: none

pool:
  name: default

variables:
  PREFIX: cvm
  ENV: dev
  LOCATION: westeurope

stages:
- stage: Bootstrap
  displayName: Bootstrap Terraform backend
  jobs:
  - job: Bootstrap
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Bootstrap remote state backend
      inputs:
        azureSubscription: SC-AZURE
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          chmod +x pipelines/scripts/bootstrap-tf-backend.sh
          ./pipelines/scripts/bootstrap-tf-backend.sh \
            --prefix "$(PREFIX)" \
            --env "$(ENV)" \
            --location "$(LOCATION)"

          echo "TF_STATE_RG=$(TF_STATE_RG)"
          echo "TF_STATE_STORAGE=$(TF_STATE_STORAGE)"
          echo "TF_STATE_CONTAINER=$(TF_STATE_CONTAINER)"
          echo "TF_STATE_KEY=$(TF_STATE_KEY)"
