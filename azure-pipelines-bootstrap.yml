trigger: none
pr: none

pool:
  name: Default

variables:
  PREFIX: cvm
  ENV: dev
  LOCATION: westeurope

stages:
- stage: Bootstrap
  displayName: Bootstrap Terraform backend
  jobs:
  - job: Bootstrap
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Bootstrap remote state backend
      inputs:
        azureSubscription: SC-AZURE
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          & "$(Build.SourcesDirectory)/pipelines/scripts/bootstrap-tf-backend.ps1" `
            -Prefix "$(PREFIX)" `
            -EnvName "$(ENV)" `
            -Location "$(LOCATION)"

          Write-Host "TF_STATE_RG=$(TF_STATE_RG)"
          Write-Host "TF_STATE_STORAGE=$(TF_STATE_STORAGE)"
          Write-Host "TF_STATE_CONTAINER=$(TF_STATE_CONTAINER)"
          Write-Host "TF_STATE_KEY=$(TF_STATE_KEY)"
