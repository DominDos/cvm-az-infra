trigger: none
pr: none

pool:
  name: Default

variables:
  PREFIX: cvm
  ENV: dev
  LOCATION: westeurope

stages:
- stage: Bootstrap
  displayName: Bootstrap Terraform backend
  jobs:
  - job: Bootstrap
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Bootstrap remote state backend
      inputs:
        azureSubscription: SC-AZURE
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          & "$(Build.SourcesDirectory)/pipelines/scripts/bootstrap-tf-backend.ps1" `
            -Prefix "$(PREFIX)" `
            -EnvName "$(ENV)" `
            -Location "$(LOCATION)"

          Write-Host 'TF backend bootstrap completed; TF_STATE_* pipeline variables set for subsequent steps/jobs.'
